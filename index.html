<style>

  .cover-inner{position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; padding:5vh 20px 6vh;}
  /* 标题正上方居中 */

  .dot{width:8px; height:8px; border-radius:50%; background:#ff4d4f; animation:pulse 1.6s infinite;}

    content:""; position:absolute; inset:-6px; border-radius:999px;

  }
  @keyframes ring{0%{transform:scale(.96); opacity:.9;} 100%{transform:scale(1.12); opacity:0;}}
  .enter-tip{font-size:13px; color:rgba(255,255,255,.72); letter-spacing:1px;}
  .cover-foot{text-align:center; font-size:12px; color:rgba(255,255,255,.6); line-height:1.9; padding-top:10px;}

  /* ================= 密码弹窗 ================= */
  .mask{

  @keyframes shake{0%,100%{transform:translateX(0);} 20%{transform:translateX(-9px);} 40%{transform:translateX(9px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);}}

  .thumb{
    position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:var(--thumb-bg);
  }
  .thumb .blur{
    position:absolute; inset:-8%; background-size:cover; background-position:center;
    filter:blur(22px) brightness(.72) saturate(1.2); transform:scale(1.12); opacity:.9;

  .thumb img{
    position:absolute; inset:0; width:100%; height:100%;

  .card .meta{

  .empty{

  .fab{
    position:fixed; right:16px; bottom:18px; z-index:40; width:46px; height:46px; border-radius:50%;
    border:none; cursor:pointer; background:rgba(10,27,61,.86); color:#fff; font-size:18px;
    box-shadow:0 8px 20px rgba(0,0,0,.28); display:none;

  .fab.show{display:block;}
  .toast{
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(20px); z-index:90;
    padding:11px 20px; border-radius:999px; background:rgba(10,27,61,.92); color:#fff; font-size:14px;
    opacity:0; pointer-events:none; transition:.25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .pull{
    position:fixed; top:0; left:0; right:0; z-index:25; text-align:center; color:#fff;
    font-size:13px; padding:8px 0; background:var(--blue); transform:translateY(-100%); transition:transform .25s;
  }
  .pull.show{transform:translateY(0);}
  @media (max-width:520px){
    .head-title .t{font-size:13px;}
    .icon-btn span{display:none;}
    .grid{gap:8px; padding:0 8px;}
    .col{gap:8px;}
    .lb .nav{width:40px; height:40px;}
  }
</style>

<script>
(function () {
  "use strict";

  /* ================== 配置 ================== */
  var CONFIG = {
    // 密码：页面源码是公开的，所以这里只存 SHA-256 值（明文为 nanwuXYH2026）
    // 想改密码：把下面明文改掉，再把 passwordHash 换成新密码的 SHA-256（小写 64 位十六进制）
    password: "nanwuXYH2026",
    passwordHash: "4fcb28b08cb8d2582d52634adb009b5732e4877e7b99818f2a7743d9aad205d1",

    manifest: "manifest.json",   // GitHub Actions 自动生成（仓库根目录）
    api: "api/photos",           // 本地预览用（server.py）
    order: "desc",               // desc = 最新照片在最上面；asc 则最早的最上面
    fit: "contain",              // contain = 完整显示照片（默认，留白处用同色模糊填充）；cover = 裁切填满 16:9
    aspect: "16 / 9",            // 显示框比例
    autoInterval: 60000,         // 自动刷新间隔（毫秒），GitHub Pages 建议 60 秒
    ext: /\.(jpe?g|png|gif|webp|bmp|avif|jfif|heic)$/i
  };

  var $ = function (id) { return document.getElementById(id); };
  function showPage(id) {
    ["cover", "live"].forEach(function (p) { $(p).classList.toggle("active", p === id); });
    $("topBtn").classList.remove("show");
    window.scrollTo(0, 0);
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }
  function fmt(d) {
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  /* ================== 密码校验（优先用哈希比对） ================== */
  async function sha256(str) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
    }
    return null;
  }

  var unlocked = false;
  try { unlocked = sessionStorage.getItem("nw_unlocked") === "1"; } catch (e) {}

  function enterLive() {
    unlocked = true;
    try { sessionStorage.setItem("nw_unlocked", "1"); } catch (e) {}
    showPage("live");
    refresh(true);
  }
  function askPassword() {
    $("lockMask").classList.add("show");
    var inp = $("pwdInput");
    inp.value = "";
    $("pwdErr").textContent = "";
    setTimeout(function () { inp.focus(); }, 80);
  }
  function closeLock() { $("lockMask").classList.remove("show"); }
  function rejectPwd(msg) {
    $("pwdErr").textContent = msg || "密码不正确，请重新输入";
    var box = $("lockBox");
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
    $("pwdInput").select();
  }
  async function checkPwd() {
    var v = $("pwdInput").value.trim();
    if (!v) { rejectPwd("请输入密码"); return; }
    var h = await sha256(v);
    var ok = h ? (h === CONFIG.passwordHash) : (v === CONFIG.password);
    if (ok) {
      closeLock();
      enterLive();
      toast("欢迎观看体育节图片直播");
    } else {
      rejectPwd();
    }
  }
  $("enterBtn").addEventListener("click", function () {
    if (unlocked) { enterLive(); } else { askPassword(); }
  });
  $("pwdOk").addEventListener("click", checkPwd);
  $("pwdCancel").addEventListener("click", closeLock);
  $("pwdInput").addEventListener("keydown", function (e) { if (e.key === "Enter") checkPwd(); });
  $("lockMask").addEventListener("click", function (e) { if (e.target === $("lockMask")) closeLock(); });
  $("backBtn").addEventListener("click", function () { showPage("cover"); });

  /* ================== 图片源：自动探测，无需手动选择文件夹 ==================
     1) 本地预览（server.py）      -> api/photos
     2) GitHub Pages 静态托管      -> manifest.json（Actions 自动生成）
     3) 兜底：GitHub API 直读仓库  -> api.github.com/repos/.../contents/pic
  ------------------------------------------------------------------------ */
  var source = "auto";

  function normalize(arr, base) {
    return arr.map(function (p) {
      var url = p.url || p.download_url || ((base || "pic/") + encodeURIComponent(p.name));
      return {
        key: p.path || p.name || url,
        name: p.name || String(url).split("/").pop(),
        url: url,
        mtime: Number(p.mtime || 0),
        time: p.time || (p.mtime ? fmt(new Date(Number(p.mtime) * 1000)) : ""),
        width: Number(p.width || 0),
        height: Number(p.height || 0)
      };
    }).filter(function (p) { return CONFIG.ext.test(p.name); });
  }

  async function tryApi() {
    var r = await fetch(CONFIG.api + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    var j = await r.json();
    if (!j || !Array.isArray(j.photos)) return null;
    source = "api";
    return normalize(j.photos, "pic/");
  }
  async function tryManifest() {
    var r = await fetch(CONFIG.manifest + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    var j = await r.json();
    var arr = Array.isArray(j) ? j : (j.photos || []);
    if (!arr.length) return null;
    source = "manifest";
    return normalize(arr, "pic/");
  }
  async function tryGithubApi() {
    // 从 GitHub Pages 网址自动推断 owner / repo，无需手工配置
    var host = location.hostname, seg = location.pathname.split("/").filter(Boolean);
    var owner = null, repo = null;
    if (/\.github\.io$/i.test(host)) {
      owner = host.split(".")[0];
      repo = seg.length ? seg[0] : null;
    }
    if (!owner || !repo) return null;
    var url = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/pic?ref=main&t=" + Date.now();
    var r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) {
      r = await fetch(url.replace("ref=main", "ref=master"), { headers: { Accept: "application/vnd.github+json" } });
      if (!r.ok) return null;
    }
    var j = await r.json();
    if (!Array.isArray(j)) return null;
    source = "github-api";
    var out = j.map(function (it) {
      return { name: it.name, url: "pic/" + encodeURIComponent(it.name), mtime: 0, time: "" };
    });
    return normalize(out, "pic/");
  }

  async function loadPhotos() {
    var steps = [tryApi, tryManifest, tryGithubApi];
    for (var i = 0; i < steps.length; i++) {
      try {
        var res = await steps[i]();
        if (res && res.length) return res;
      } catch (e) {}
    }
    return null;
  }

  /* ================== 渲染：左右两列 + 16:9 显示框 ================== */
  var known = Object.create(null);
  var cardCache = Object.create(null);
  var current = [];
  var firstLoad = true;
  var loading = false;

  function buildCard(p) {
    var card = document.createElement("figure");
    card.className = "card";

    var thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.style.aspectRatio = CONFIG.aspect;

    if (CONFIG.fit === "contain") {
      var blur = document.createElement("div");
      blur.className = "blur";
      blur.style.backgroundImage = "url('" + p.url + "')";
      thumb.appendChild(blur);
    }

    var img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = p.name;
    img.src = p.url;
    img.style.objectFit = CONFIG.fit;
    thumb.appendChild(img);

    var meta = document.createElement("figcaption");
    meta.className = "meta";
    var nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = p.name;
    var tm = document.createElement("span");
    tm.className = "tm";
    tm.textContent = p.time || "";
    meta.appendChild(nm);
    meta.appendChild(tm);

    card.appendChild(thumb);
    card.appendChild(meta);
    card.addEventListener("click", function () { openLb(p.key); });   // 单击看大图
    return card;
  }

  function render(list) {
    var added = 0;
    list.forEach(function (p) {
      p.isNew = !firstLoad && !known[p.key];
      if (!known[p.key]) added++;
      if (!cardCache[p.key]) cardCache[p.key] = buildCard(p);
      var card = cardCache[p.key];
      card.classList.toggle("is-new", !!p.isNew);
      var badge = card.querySelector(".new");
      if (p.isNew && !badge) {
        badge = document.createElement("span");
        badge.className = "new";
        badge.textContent = "新";
        card.appendChild(badge);
      } else if (!p.isNew && badge) {
        badge.remove();
      }
      var no = card.querySelector(".no");
      if (!no) {
        no = document.createElement("span");
        no.className = "no";
        card.appendChild(no);
      }
      no.textContent = "";   // 序号在 layout 时写入
    });

    // 清理已被删除的图片
    var alive = Object.create(null);
    list.forEach(function (p) { alive[p.key] = 1; });
    Object.keys(cardCache).forEach(function (k) {
      if (!alive[k]) { delete cardCache[k]; delete known[k]; }
    });

    current = list;
    layout(list);

    $("count").textContent = list.length;
    $("scanTime").textContent = fmt(new Date());
    $("delta").textContent = (added && !firstLoad) ? "（本次新增 " + added + " 张）" : "";
    $("emptyBox").innerHTML = "";
    firstLoad = false;
    list.forEach(function (p) { known[p.key] = 1; });
    return added;
  }

  // 两列：按时间顺序左右交替（16:9 等高，序号为 1,2 / 3,4 …）
  function layout(list) {
    var L = $("colL"), R = $("colR");
    L.innerHTML = ""; R.innerHTML = "";
    list.forEach(function (p, i) {
      var card = cardCache[p.key];
      if (!card) return;
      var no = card.querySelector(".no");
      if (no) no.textContent = "#" + (i + 1);
      (i % 2 === 0 ? L : R).appendChild(card);
    });
  }

  function showEmpty(msg) {
    $("colL").innerHTML = ""; $("colR").innerHTML = "";
    $("count").textContent = "0";
    $("emptyBox").innerHTML =
      '<div class="empty"><h3>暂未读取到图片</h3>' +
      (msg ? '<p>' + msg + '</p>' : '') +
      '<p>GitHub Pages 是静态托管，需要先生成图片清单：</p>' +
      '<p>① 把照片放进仓库的 <code>pic</code> 文件夹并推送</p>' +
      '<p>② 在仓库 <b>Actions</b> 页手动运行一次「更新图片清单」，或等推送自动触发</p>' +
      '<p>③ 回到本页点「刷新」即可</p>' +
      '<button class="btn primary" id="retryBtn">重新读取</button></div>';
    var b = $("retryBtn");
    if (b) b.addEventListener("click", function () { refresh(true); });
  }

  async function refresh(manual) {
    if (loading) return;
    loading = true;
    $("refreshBtn").classList.add("spin");
    try {
      var list = await loadPhotos();
      if (!list || !list.length) { showEmpty(); return; }
      var dir = CONFIG.order === "asc" ? -1 : 1;   // desc(默认): 修改时间最新的排最上面
      list.sort(function (a, b) {
        if (b.mtime !== a.mtime) return (b.mtime - a.mtime) * dir;   // 按修改时间排列
        return String(b.name).localeCompare(String(a.name)) * dir;
      });
      var added = render(list);
      if (manual) toast(added ? "已更新，新增 " + added + " 张" : "已刷新，暂无新照片");
    } catch (e) {
      showEmpty("读取失败：" + (e && e.message ? e.message : e));
    } finally {
      loading = false;
      $("refreshBtn").classList.remove("spin");
    }
  }

  /* ================== 刷新交互 ================== */
  $("refreshBtn").addEventListener("click", function () { refresh(true); });
  document.addEventListener("keydown", function (e) {
    if ($("lockMask").classList.contains("show") || $("lb").classList.contains("show")) return;
    if (e.key === "r" || e.key === "R") { e.preventDefault(); refresh(true); }
  });

  var autoTimer = null, autoOn = true;
  function setAuto(on) {
    autoOn = on;
    $("autoBtn").classList.toggle("on", on);
    clearInterval(autoTimer);
    if (on) autoTimer = setInterval(function () {
      if ($("live").classList.contains("active") && !document.hidden) refresh(false);
    }, CONFIG.autoInterval);
  }
  $("autoBtn").addEventListener("click", function () {
    setAuto(!autoOn);
    toast(autoOn ? "已开启自动刷新（每 " + (CONFIG.autoInterval / 1000) + " 秒）" : "已关闭自动刷新");
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && $("live").classList.contains("active")) refresh(false);
  });

  var startY = 0, pulling = false;
  document.addEventListener("touchstart", function (e) {
    if (window.scrollY <= 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (pulling && window.scrollY <= 0 && e.touches[0].clientY - startY > 70) $("pullTip").classList.add("show");
  }, { passive: true });
  document.addEventListener("touchend", function () {
    if ($("pullTip").classList.contains("show")) {
      $("pullTip").classList.remove("show");
      if ($("live").classList.contains("active")) refresh(true);
    }
    pulling = false;
  });

  /* ================== 灯箱（单击查看大图） ================== */
  var lbIndex = 0;
  function openLb(key) {
    var i = current.findIndex(function (p) { return p.key === key; });
    if (i < 0) return;
    lbIndex = i;
    showLb();
    $("lb").classList.add("show");
  }
  function showLb() {
    var p = current[lbIndex];
    if (!p) return;
    $("lbLoading").style.display = "block";
    $("lbImg").style.visibility = "hidden";
    var im = new Image();
    im.onload = function () {
      $("lbImg").src = p.url;
      $("lbImg").style.visibility = "visible";
      $("lbLoading").style.display = "none";
    };
    im.onerror = function () { $("lbLoading").textContent = "大图加载失败"; };
    im.src = p.url;
    $("lbCap").textContent = p.name + (p.time ? " · " + p.time : "") +
                             "　(" + (lbIndex + 1) + "/" + current.length + ")";
  }
  function lbStep(d) {
    if (!current.length) return;
    lbIndex = (lbIndex + d + current.length) % current.length;
    showLb();
  }
  $("lbClose").addEventListener("click", function () { $("lb").classList.remove("show"); });
  $("lbPrev").addEventListener("click", function (e) { e.stopPropagation(); lbStep(-1); });
  $("lbNext").addEventListener("click", function (e) { e.stopPropagation(); lbStep(1); });
  $("lb").addEventListener("click", function (e) {
    if (e.target.id === "lb" || e.target.className === "stage") $("lb").classList.remove("show");
  });
  document.addEventListener("keydown", function (e) {
    if (!$("lb").classList.contains("show")) return;
    if (e.key === "Escape") $("lb").classList.remove("show");
    if (e.key === "ArrowLeft") lbStep(-1);
    if (e.key === "ArrowRight") lbStep(1);
  });

  $("topBtn").addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
  window.addEventListener("scroll", function () {
    $("topBtn").classList.toggle("show", $("live").classList.contains("active") && window.scrollY > 500);
  });

  /* ================== 启动 ================== */
  setAuto(true);
  if (unlocked) { showPage("live"); refresh(false); }
})();
</script>
</body>
</html>
